<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Circle gradient -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#065f46" /> <!-- emerald-800 -->
      <stop offset="100%" stop-color="#022c22" /> <!-- emerald-950 -->
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" /> <!-- amber-400 -->
      <stop offset="50%" stop-color="#f59e0b" /> <!-- amber-500 -->
      <stop offset="100%" stop-color="#b45309" /> <!-- amber-700 -->
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Shield -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Subtle Rotating Islamic Star Background Pattern -->
  <g fill="none" stroke="url(#goldGrad)" opacity="0.14" stroke-width="1.2">
    <rect x="106" y="106" width="300" height="300" rx="8" transform="rotate(0, 256, 256)" />
    <rect x="106" y="106" width="300" height="300" rx="8" transform="rotate(45, 256, 256)" />
    <rect x="131" y="131" width="250" height="250" rx="6" transform="rotate(22.5, 256, 256)" />
    <rect x="131" y="131" width="250" height="250" rx="6" transform="rotate(67.5, 256, 256)" />
    <circle cx="256" cy="256" r="120" stroke-dasharray="4,4" />
  </g>

  <!-- Centered Inner Graphics Group -->
  <g transform="translate(0, 18)">
    <!-- Glowing rays / background accents -->
    <path d="M 256 30 L 256 60 M 256 450 L 256 480 M 30 256 L 60 256 M 450 256 L 480 256" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Islamic Dome Silhouette in Golden Gradient -->
    <g transform="translate(128, 120) scale(1)">
      <!-- Base / Pillars of the Dome structure -->
      <rect x="40" y="110" width="176" height="15" rx="4" fill="url(#goldGrad)" />
      <path d="M 48 125 L 48 150 L 208 150 L 208 125 Z" fill="url(#goldGrad)" opacity="0.85" />
      <rect x="30" y="150" width="196" height="8" rx="2" fill="url(#goldGrad)" />
      
      <!-- Arch windows inside dome base -->
      <path d="M64 142 C 64 134, 74 134, 74 142 L 74 150 L 64 150 Z" fill="#022c22" />
      <path d="M96 142 C 96 134, 106 134, 106 142 L 106 150 L 96 150 Z" fill="#022c22" />
      <path d="M128 140 C 128 132, 138 132, 138 140 L 138 150 L 128 150 Z" fill="#022c22" />
      <path d="M160 142 C 160 134, 170 134, 170 142 L 170 150 L 160 150 Z" fill="#022c22" />
      <path d="M192 142 C 192 134, 202 134, 202 142 L 202 150 L 192 150 Z" fill="#022c22" />

      <!-- Islamic Onion Dome Curve shape -->
      <path d="M 128 15 C 128 15, 138 45, 185 55 C 220 63, 225 100, 216 110 L 40 110 C 31 100, 36 63, 71 55 C 118 45, 128 15, 128 15 Z" fill="url(#goldGrad)" />
      
      <!-- Dome Ornament Spire (Hilal on top) -->
      <line x1="128" y1="15" x2="128" y2="2" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
      <path d="M 128 1 C 132 -2, 132 -8, 127 -10 C 124 -11, 121 -9, 121 -9 C 124 -8, 125 -4, 123 1 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Big Crescent and Star behind / wrapping dome -->
    <path d="M 256 50 A 190 190 0 1 0 420 310 A 160 160 0 1 1 256 94" fill="url(#goldGrad)" opacity="0.15" />

    <!-- Left and Right Golden Laurel Branches (Symmetry) -->
    <g stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round">
      <!-- Left Leaf Stem -->
      <path d="M 90 320 C 80 370, 110 410, 160 430" />
      <circle cx="90" cy="320" r="5" fill="url(#goldGrad)" />
      <circle cx="83" cy="345" r="5" fill="url(#goldGrad)" />
      <circle cx="85" cy="370" r="5" fill="url(#goldGrad)" />
      <circle cx="95" cy="392" r="5" fill="url(#goldGrad)" />
      <circle cx="112" cy="410" r="5" fill="url(#goldGrad)" />
      <circle cx="134" cy="422" r="5" fill="url(#goldGrad)" />

      <!-- Right Leaf Stem -->
      <path d="M 422 320 C 432 370, 402 410, 352 430" />
      <circle cx="422" cy="320" r="5" fill="url(#goldGrad)" />
      <circle cx="429" cy="345" r="5" fill="url(#goldGrad)" />
      <circle cx="427" cy="370" r="5" fill="url(#goldGrad)" />
      <circle cx="417" cy="392" r="5" fill="url(#goldGrad)" />
      <circle cx="400" cy="410" r="5" fill="url(#goldGrad)" />
      <circle cx="378" cy="422" r="5" fill="url(#goldGrad)" />
    </g>

    <!-- Rehal / Open Book (The Holy Quran) representing Islamic Education -->
    <g transform="translate(136, 275)">
      <!-- Book Stand (Rehal) Golden wooden style -->
      <path d="M40 76 L 120 110 L 200 76 L 160 120 L 80 120 Z" fill="url(#goldGrad)" opacity="0.9" />
      <!-- Shadows -->
      <path d="M 120 110 L 140 125 L 100 125 Z" fill="#022c22" opacity="0.5" />

      <!-- Open book pages (Left side) -->
      <path d="M 30 65 C 30 65, 70 30, 120 50 L 120 95 C 70 75, 30 110, 30 110 Z" fill="url(#whiteGrad)" stroke="#cbd5e1" stroke-width="2" />
      <!-- Open book pages (Right side) -->
      <path d="M 210 65 C 210 65, 170 30, 120 50 L 120 95 C 170 75, 210 110, 210 110 Z" fill="url(#whiteGrad)" stroke="#cbd5e1" stroke-width="2" />
      
      <!-- Quranic Calligraphy / Text lines simulation -->
      <path d="M 45 61 L 105 45 M 45 73 L 105 57 M 45 85 L 105 70 M 45 97 L 105 82" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      <path d="M 195 61 L 135 45 M 195 73 L 135 57 M 195 85 L 135 70 M 195 97 L 135 82" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.7" />
      
      <!-- Golden bookmark ribbon hanging down -->
      <path d="M 117 50 L 117 115 L 123 115 L 123 50 Z" fill="url(#goldGrad)" />
      <path d="M 117 115 L 112 122 L 120 120 L 128 122 L 123 115" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
